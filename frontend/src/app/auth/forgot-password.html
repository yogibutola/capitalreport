<div class="flex-center" style="min-height: 100vh;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 class="text-gradient" style="text-align: center; margin-bottom: var(--space-xs);">Forgot Password</h2>

        @if (!submitted()) {
        <p style="text-align: center; color: var(--color-text-muted); margin-bottom: var(--space-lg);">
            Enter your account email and we'll send you a link to reset your password.
        </p>

        <form #f="ngForm" (ngSubmit)="onSubmit(f)" (input)="clearServerErrors()" novalidate>
            <app-form-summary [form]="f" [attempted]="submitAttempted()" [labels]="{ email: 'Email' }" />
            <app-form-banner [message]="formError()" />

            <div class="form-group">
                <label for="field-email" style="display: block; margin-bottom: var(--space-xs);">Email</label>
                <input id="field-email" type="email" [(ngModel)]="email" name="email" #emailCtrl="ngModel"
                    class="input-field" placeholder="you@example.com" required email
                    aria-describedby="err-email"
                    [appInvalid]="emailCtrl" [appInvalidServer]="fieldErrors()['email']" [appInvalidForce]="submitAttempted()">
                <app-field-error id="err-email" label="Email" [control]="emailCtrl"
                    [serverError]="fieldErrors()['email']" [forceShow]="submitAttempted()" />
            </div>

            <button type="submit" class="btn" style="width: 100%;" [disabled]="isSubmitting()">
                {{ isSubmitting() ? 'Sending…' : 'Send Reset Link' }}
            </button>
        </form>
        } @else {
        <p style="text-align: center; color: var(--color-text-muted);">
            If an account exists for that email, we've sent a link to reset your password.
        </p>
        }

        <div style="margin-top: var(--space-md); text-align: center; font-size: 0.9rem;">
            <a routerLink="/login" style="color: HSL(var(--color-ace-lime)); text-decoration: none;">Back to Sign In</a>
        </div>
    </div>
</div>
