<div class="flex-center" style="min-height: 100vh;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 class="text-gradient" style="text-align: center; margin-bottom: var(--space-lg);">The League</h2>

        <form #f="ngForm" (ngSubmit)="onLogin(f)" (input)="clearServerErrors()" novalidate>
            <app-form-summary [form]="f" [attempted]="submitAttempted()"
                [labels]="{ email: 'Email', password: 'Password' }" />
            <app-form-banner [message]="formError()" />

            <div class="form-group">
                <label for="field-email" style="display: block; margin-bottom: var(--space-xs);">Email</label>
                <input id="field-email" type="email" [(ngModel)]="email" name="email" #emailCtrl="ngModel"
                    class="input-field" placeholder="you@example.com" required email
                    aria-describedby="err-email"
                    [appInvalid]="emailCtrl" [appInvalidServer]="fieldErrors()['email']" [appInvalidForce]="submitAttempted()">
                <app-field-error id="err-email" label="Email" [control]="emailCtrl"
                    [serverError]="fieldErrors()['email']" [forceShow]="submitAttempted()" />
            </div>

            <div class="form-group">
                <label for="field-password" style="display: block; margin-bottom: var(--space-xs);">Password</label>
                <input id="field-password" type="password" [(ngModel)]="password" name="password" #passwordCtrl="ngModel"
                    class="input-field" placeholder="Enter password" required
                    aria-describedby="err-password"
                    [appInvalid]="passwordCtrl" [appInvalidServer]="fieldErrors()['password']" [appInvalidForce]="submitAttempted()">
                <app-field-error id="err-password" label="Password" [control]="passwordCtrl"
                    [serverError]="fieldErrors()['password']" [forceShow]="submitAttempted()" />
            </div>

            <button type="submit" class="btn" style="width: 100%;" [disabled]="isSubmitting()">
                {{ isSubmitting() ? 'Signing in…' : 'Sign In' }}
            </button>
        </form>

        <div style="margin-top: var(--space-md); text-align: center; font-size: 0.9rem;">
            <span style="color: var(--color-text-muted);">New here? </span>
            <a routerLink="/signup" style="color: HSL(var(--color-ace-lime)); text-decoration: none;">Create an
                account</a>
        </div>
    </div>
</div>
