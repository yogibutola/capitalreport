<div class="flex-center" style="min-height: 100vh;">
    <div class="card admin-card" style="width: 100%; max-width: 400px;">
        <h2 class="text-gradient" style="text-align: center; margin-bottom: var(--space-xs);">Platform Console</h2>
        <p style="text-align: center; color: var(--color-text-muted); margin-bottom: var(--space-lg);">
            Restricted access.
        </p>

        <form #f="ngForm" (ngSubmit)="onLogin(f)" (input)="clearServerErrors()" novalidate>
            <app-form-summary [form]="f" [attempted]="submitAttempted()"
                [labels]="{ email: 'Email', password: 'Password' }" />
            <app-form-banner [message]="formError()" />

            <div class="form-group">
                <label for="pc-email" style="display: block; margin-bottom: var(--space-xs);">Email</label>
                <input id="pc-email" type="email" [(ngModel)]="email" name="email" #emailCtrl="ngModel"
                    class="input-field" required email autocomplete="off"
                    [appInvalid]="emailCtrl" [appInvalidServer]="fieldErrors()['email']"
                    [appInvalidForce]="submitAttempted()">
                <app-field-error label="Email" [control]="emailCtrl" [serverError]="fieldErrors()['email']"
                    [forceShow]="submitAttempted()" />
            </div>

            <div class="form-group">
                <label for="pc-password" style="display: block; margin-bottom: var(--space-xs);">Password</label>
                <input id="pc-password" type="password" [(ngModel)]="password" name="password" #passwordCtrl="ngModel"
                    class="input-field" required autocomplete="off"
                    [appInvalid]="passwordCtrl" [appInvalidServer]="fieldErrors()['password']"
                    [appInvalidForce]="submitAttempted()">
                <app-field-error label="Password" [control]="passwordCtrl" [serverError]="fieldErrors()['password']"
                    [forceShow]="submitAttempted()" />
            </div>

            <button type="submit" class="btn" style="width: 100%;" [disabled]="isSubmitting()">
                {{ isSubmitting() ? 'Signing in…' : 'Sign In' }}
            </button>
        </form>
    </div>
</div>
